<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EletroCalc - Calculadora de Carregamento Veicular</title>
  
  <!-- Configurações PWA e Logo -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#1e293b">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EletroCalc">
  <link rel="icon" type="image/png" href="logo.png">
  <link rel="apple-touch-icon" href="logo.png">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <style>
    :root {
      --bg-color: #1e293b;
      --card-bg: #1e293b;
      --shadow-dark: #141c28;
      --shadow-light: #28364e;
      --primary: #10b981;
      --primary-hover: #059669;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --text-kwh: #3b82f6;
      --text-time: #f59e0b;
      --text-range: #38bdf8;
      --danger: #ef4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', sans-serif;
    }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .neu-container {
      width: 100%;
      max-width: 460px;
      background: var(--bg-color);
      border-radius: 30px;
      padding: 28px;
      box-shadow:  12px 12px 24px var(--shadow-dark),
                  -12px -12px 24px var(--shadow-light);
    }

    .header {
      text-align: center;
      margin-bottom: 24px;
    }

    .header img.app-logo {
      width: 100%;
      max-width: 260px;
      height: auto;
      object-fit: contain;
    }

    .form-group {
      margin-bottom: 18px;
    }

    .form-group label {
      display: block;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .neu-input {
      width: 100%;
      padding: 14px 18px;
      background: var(--bg-color);
      border: none;
      border-radius: 16px;
      color: var(--text-main);
      font-size: 0.95rem;
      font-weight: 600;
      outline: none;
      box-shadow: inset 4px 4px 8px var(--shadow-dark),
                  inset -4px -4px 8px var(--shadow-light);
      transition: all 0.2s;
    }

    select.neu-input option {
      background-color: #0f172a;
      color: var(--text-main);
    }

    .manual-power-container {
      margin-top: 10px;
      display: none;
    }

    .range-header {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
      margin-bottom: 8px;
    }

    input[type="range"] {
      -webkit-appearance: none;
      appearance: none;
      width: 100%;
      height: 10px;
      border-radius: 10px;
      background: var(--bg-color);
      outline: none;
      box-shadow: inset 2px 2px 5px var(--shadow-dark),
                  inset -2px -2px 5px var(--shadow-light);
      cursor: pointer;
    }

    input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 2px 2px 5px var(--shadow-dark);
      cursor: pointer;
      border: 2px solid var(--bg-color);
    }

    input[type="range"]::-moz-range-thumb {
      width: 22px;
      height: 22px;
      border-radius: 50%;
      background: #f8fafc;
      box-shadow: 2px 2px 5px var(--shadow-dark);
      cursor: pointer;
      border: 2px solid var(--bg-color);
    }

    .neu-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 18px;
      border-radius: 16px;
      background: var(--bg-color);
      box-shadow: 4px 4px 8px var(--shadow-dark),
                 -4px -4px 8px var(--shadow-light);
      margin-bottom: 24px;
    }

    .neu-toggle span {
      font-size: 0.85rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 44px;
      height: 24px;
    }

    .switch input { opacity: 0; width: 0; height: 0; }

    .slider-toggle {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--bg-color);
      transition: .4s;
      border-radius: 24px;
      box-shadow: inset 2px 2px 4px var(--shadow-dark),
                  inset -2px -2px 4px var(--shadow-light);
    }

    .slider-toggle:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 3px;
      bottom: 3px;
      background-color: var(--text-muted);
      transition: .4s;
      border-radius: 50%;
    }

    input:checked + .slider-toggle:before {
      transform: translateX(20px);
      background-color: var(--primary);
    }

    .neu-result-card {
      padding: 24px;
      border-radius: 24px;
      background: var(--bg-color);
      text-align: center;
      box-shadow: inset 5px 5px 10px var(--shadow-dark),
                  inset -5px -5px 10px var(--shadow-light);
      margin-bottom: 20px;
    }

    .result-price {
      font-size: 3rem;
      font-weight: 800;
      color: #34d399;
      line-height: 1.1;
      margin-bottom: 6px;
    }

    .result-kwh {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-kwh);
      margin-bottom: 12px;
    }

    .divider {
      height: 2px;
      border-radius: 2px;
      background: var(--bg-color);
      box-shadow: inset 1px 1px 2px var(--shadow-dark),
                  inset -1px -1px 2px var(--shadow-light);
      margin: 14px 0;
    }

    .result-time {
      font-size: 1.15rem;
      font-weight: 700;
      color: var(--text-time);
      margin-bottom: 6px;
    }

    .result-range {
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-range);
      line-height: 1.5;
    }

    .result-range-inmetro {
      font-size: 0.75rem;
      font-weight: 500;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .timer-panel {
      display: none;
      background: var(--bg-color);
      padding: 18px;
      border-radius: 20px;
      margin-bottom: 20px;
      text-align: center;
      box-shadow: inset 4px 4px 8px var(--shadow-dark),
                  inset -4px -4px 8px var(--shadow-light);
    }

    .timer-display {
      font-size: 2.2rem;
      font-weight: 800;
      color: var(--text-time);
      letter-spacing: 1px;
      margin: 6px 0;
    }

    .timer-alert {
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--text-muted);
    }

    .button-group {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .btn-action {
      width: 100%;
      padding: 16px;
      background: var(--bg-color);
      color: var(--primary);
      border: none;
      border-radius: 16px;
      font-size: 1rem;
      font-weight: 800;
      cursor: pointer;
      box-shadow: 6px 6px 12px var(--shadow-dark),
                 -6px -6px 12px var(--shadow-light);
      transition: all 0.2s;
    }

    .btn-start-charge {
      color: #38bdf8;
    }

    .btn-cancel-charge {
      color: var(--danger);
    }

    .btn-action:active {
      box-shadow: inset 3px 3px 6px var(--shadow-dark),
                  inset -3px -3px 6px var(--shadow-light);
    }
  </style>
</head>
<body>

<div class="neu-container" id="app-container">
  <div class="header">
    <img src="logo.png" alt="EletroCalc Logo" class="app-logo">
  </div>

  <!-- DROPDOWN 1: MARCA DO VEÍCULO -->
  <div class="form-group">
    <label for="brandSelect">Marca do Veículo</label>
    <select id="brandSelect" class="neu-input" onchange="onBrandChange()"></select>
  </div>

  <!-- DROPDOWN 2: MODELO DO VEÍCULO -->
  <div class="form-group">
    <label for="modelSelect">Modelo do Veículo</label>
    <select id="modelSelect" class="neu-input" onchange="calculate()"></select>
  </div>

  <div class="form-group">
    <div class="range-header">
      <span style="color: var(--text-muted);">Carga Atual</span>
      <strong id="currentBatteryVal">38%</strong>
    </div>
    <input type="range" id="currentBattery" min="0" max="100" value="38" oninput="validateAndUpdateBattery(); calculate();">
  </div>

  <div class="form-group">
    <div class="range-header">
      <span style="color: var(--text-muted);">Meta Desejada</span>
      <strong id="targetBatteryVal">80%</strong>
    </div>
    <input type="range" id="targetBattery" min="0" max="100" value="80" oninput="validateAndUpdateBattery(); calculate();">
  </div>

  <div class="form-group">
    <label for="chargerPower">Potência do Carregador</label>
    <select id="chargerPower" class="neu-input" onchange="toggleManualPower(); calculate();">
      <option value="3.7">3.7 kW (Portátil / 20A)</option>
      <option value="7.4" selected>7.4 kW (Wallbox Monofásico)</option>
      <option value="11">11.0 kW (Wallbox Trifásico)</option>
      <option value="22">22.0 kW (AC Rápido)</option>
      <option value="50">50.0 kW (DC Rápido)</option>
      <option value="150">150.0 kW (DC Ultra-rápido)</option>
      <option value="custom">Outra potência (Manual)</option>
    </select>
    <div class="manual-power-container" id="manualPowerGroup">
      <input type="text" id="manualChargerPower" class="neu-input" placeholder="Digite a potência em kW (ex: 2,5)" oninput="calculate()">
    </div>
  </div>

  <div class="form-group">
    <label for="pricePerKwh">Valor por kWh (R$)</label>
    <input type="text" id="pricePerKwh" class="neu-input" value="1,59" oninput="calculate(); savePreferences();">
  </div>

  <div class="form-group">
    <label for="startFee">Cobrança de Start / Início (R$)</label>
    <input type="text" id="startFee" class="neu-input" value="0,00" oninput="calculate(); savePreferences();">
  </div>

  <div class="form-group">
    <label for="alertMinutes">Alertar Faltando (Minutos)</label>
    <input type="number" id="alertMinutes" class="neu-input" value="10" min="1" max="120" oninput="savePreferences();">
  </div>

  <div class="neu-toggle">
    <span>Potência Compartilhada (Metade)</span>
    <label class="switch">
      <input type="checkbox" id="sharedPower" onchange="calculate()">
      <span class="slider-toggle"></span>
    </label>
  </div>

  <div class="neu-result-card">
    <div class="result-price" id="totalCostDisplay">R$ 0,00</div>
    <div class="result-kwh" id="kwhNeededDisplay">Energia necessária: 0.0 kWh</div>
    <div class="divider"></div>
    <div class="result-time" id="timeDisplay">Tempo estimado: 0h 0min</div>
    <div class="result-range">
      <div id="currentRangeDisplay">Autonomia com carga atual: 0 km</div>
      <div id="targetRangeDisplay">Autonomia com meta escolhida: 0 km</div>
      <div class="result-range-inmetro">(Autonomia de acordo com o INMETRO)</div>
    </div>
  </div>

  <!-- Painel do Temporizador Regressivo -->
  <div class="timer-panel" id="timerPanel">
    <div style="font-size: 0.8rem; font-weight: 700; color: var(--text-muted); text-transform: uppercase;">Despertar em:</div>
    <div class="timer-display" id="countdownDisplay">00:00:00</div>
    <div class="timer-alert" id="timerStatusMsg">⚡ Notificação programada</div>
  </div>

  <div class="button-group">
    <button class="btn-action btn-start-charge" id="startChargeBtn" onclick="startChargingTimer()">⚡ Iniciar a Simulação</button>
    <button class="btn-action btn-cancel-charge" id="cancelChargeBtn" style="display: none;" onclick="stopChargingTimer()">⏹ Interromper a Simulação</button>
    <button class="btn-action" onclick="exportTXT()">Exportar Resumo (.txt)</button>
  </div>
</div>

<script>
  const evDatabase = [

    },

        { id: 17, modelo: "Zeekr 001 (Long Range)", kwh: 100.0, km100: 450 },
        { id: 18, modelo: "Zeekr X", kwh: 66.0, km100: 332 },

      ]
    },
    {

      modelos: [
        { id: 14, modelo: "Omoda E5 (100% EV)", kwh: 61.0, km100: 310 },
        { id: 15, modelo: "Jaecoo J6 EV (100% EV)", kwh: 65.7, km100: 320 }
      ]
    },
    {
      marca: "Outros Populares",
      modelos: [
        { id: 10, modelo: "Renault Kwid E-Tech (100% EV)", kwh: 26.8, km100: 185 },
        { id: 35, modelo: "Caoa Chery Tiggo 8 Pro Plug-in Hybrid", kwh: 19.2, km100: 77 },
        { id: 36, modelo: "Audi Q5 TFSIe (Híbrido PHEV)", kwh: 17.9, km100: 62 }
      ]
    }
  ];

  let timerInterval = null;
  let totalEstimatedSeconds = 0;
  let hasAlertedPreFinish = false;
  let isTimerActive = false;
  let timerStartTime = 0;

  function getAllCarsFlat() {
    let list = [];
    evDatabase.forEach(group => {
      group.modelos.forEach(car => {
        list.push({ ...car, marcaGroup: group.marca });
      });
    });
    return list;
  }

  function initApp() {
    const brandSelect = document.getElementById('brandSelect');
    brandSelect.innerHTML = '';
    
    evDatabase.sort((a, b) => a.marca.localeCompare(b.marca));
    evDatabase.forEach(group => {
      const option = document.createElement('option');
      option.value = group.marca;
      option.textContent = group.marca;
      brandSelect.appendChild(option);
    });

    const savedCarId = parseInt(localStorage.getItem('eletrocalc_car'));
    const allCars = getAllCarsFlat();
    const savedCar = allCars.find(c => c.id === savedCarId);

    if (savedCar) {
      brandSelect.value = savedCar.marcaGroup;
      populateModels(savedCar.marcaGroup);
      document.getElementById('modelSelect').value = savedCar.id;
    } else {
      populateModels(evDatabase[0].marca);
    }

    const savedPrice = localStorage.getItem('eletrocalc_price');
    const savedStartFee = localStorage.getItem('eletrocalc_startfee');
    const savedAlertMinutes = localStorage.getItem('eletrocalc_alertmin');

    if (savedPrice) document.getElementById('pricePerKwh').value = savedPrice;
    if (savedStartFee) document.getElementById('startFee').value = savedStartFee;
    if (savedAlertMinutes) document.getElementById('alertMinutes').value = savedAlertMinutes;

    validateAndUpdateBattery();
    calculate();
  }

  function populateModels(brandName) {
    const modelSelect = document.getElementById('modelSelect');
    modelSelect.innerHTML = '';

    const brandData = evDatabase.find(b => b.marca === brandName) || evDatabase[0];
    brandData.modelos.sort((a, b) => a.modelo.localeCompare(b.modelo));

    brandData.modelos.forEach(car => {
      const option = document.createElement('option');
      option.value = car.id;
      option.textContent = `${car.modelo} (${car.kwh} kWh)`;
      modelSelect.appendChild(option);
    });
  }

  function onBrandChange() {
    const selectedBrand = document.getElementById('brandSelect').value;
    populateModels(selectedBrand);
    calculate();
  }

  function toggleManualPower() {
    const select = document.getElementById('chargerPower');
    const manualGroup = document.getElementById('manualPowerGroup');
    if (select.value === 'custom') {
      manualGroup.style.display = 'block';
    } else {
      manualGroup.style.display = 'none';
    }
  }

  function getGradientColor(pct) {
    const colors = [
      { p: 0,   r: 0,   g: 0,   b: 0 },
      { p: 30,  r: 239, g: 68,  b: 68 },
      { p: 50,  r: 249, g: 115, b: 22 },
      { p: 75,  r: 234, g: 179, b: 8 },
      { p: 100, r: 16,  g: 185, b: 129 }
    ];

    let lower = colors[0];
    let upper = colors[colors.length - 1];

    for (let i = 0; i < colors.length - 1; i++) {
      if (pct >= colors[i].p && pct <= colors[i + 1].p) {
        lower = colors[i];
        upper = colors[i + 1];
        break;
      }
    }

    const range = upper.p - lower.p;
    const factor = range === 0 ? 0 : (pct - lower.p) / range;

    const r = Math.round(lower.r + factor * (upper.r - lower.r));
    const g = Math.round(lower.g + factor * (upper.g - lower.g));
    const b = Math.round(lower.b + factor * (upper.b - lower.b));

    return `rgb(${r}, ${g}, ${b})`;
  }

  function validateAndUpdateBattery() {
    let currentInput = document.getElementById('currentBattery');
    let targetInput = document.getElementById('targetBattery');

    let currentVal = parseInt(currentInput.value);
    let targetVal = parseInt(targetInput.value);

    if (targetVal < currentVal) {
      targetVal = currentVal;
      targetInput.value = targetVal;
    }

    const currentColor = getGradientColor(currentVal);
    const currentValElem = document.getElementById('currentBatteryVal');
    currentValElem.textContent = currentVal + '%';
    currentValElem.style.color = currentColor;
    currentInput.style.background = `linear-gradient(to right, ${currentColor} 0%, ${currentColor} ${currentVal}%, var(--bg-color) ${currentVal}%, var(--bg-color) 100%)`;

    const targetColor = getGradientColor(targetVal);
    const targetValElem = document.getElementById('targetBatteryVal');
    targetValElem.textContent = targetVal + '%';
    targetValElem.style.color = targetColor;
    targetInput.style.background = `linear-gradient(to right, ${targetColor} 0%, ${targetColor} ${targetVal}%, var(--bg-color) ${targetVal}%, var(--bg-color) 100%)`;
  }

  function savePreferences() {
    localStorage.setItem('eletrocalc_car', document.getElementById('modelSelect').value);
    localStorage.setItem('eletrocalc_price', document.getElementById('pricePerKwh').value);
    localStorage.setItem('eletrocalc_startfee', document.getElementById('startFee').value);
    localStorage.setItem('eletrocalc_alertmin', document.getElementById('alertMinutes').value);
  }

  function parseInputValue(id) {
    let valStr = document.getElementById(id).value.toString().replace(',', '.');
    return parseFloat(valStr) || 0;
  }

  function calculate() {
    const allCars = getAllCarsFlat();
    const selectedId = parseInt(document.getElementById('modelSelect').value);
    const car = allCars.find(c => c.id === selectedId) || allCars[0];
    
    const currentPct = parseFloat(document.getElementById('currentBattery').value);
    const targetPct = parseFloat(document.getElementById('targetBattery').value);
    const pricePerKwh = parseInputValue('pricePerKwh');
    const startFee = parseInputValue('startFee');
    
    let powerSelectVal = document.getElementById('chargerPower').value;
    let power = 0;

    if (powerSelectVal === 'custom') {
      power = parseInputValue('manualChargerPower');
    } else {
      power = parseFloat(powerSelectVal) || 0;
    }

    const isShared = document.getElementById('sharedPower').checked;

    savePreferences();

    const diffPct = Math.max(0, targetPct - currentPct);
    const neededKwh = car.kwh * (diffPct / 100);
    const totalCost = (neededKwh * pricePerKwh) + startFee;

    if (isShared && power > 0) {
      power = power / 2;
    }

    document.getElementById('totalCostDisplay').textContent = `R$ ${totalCost.toFixed(2).replace('.', ',')}`;
    document.getElementById('kwhNeededDisplay').textContent = `Energia necessária: ${neededKwh.toFixed(1)} kWh`;

    if (power > 0 && diffPct > 0) {
      const totalHours = neededKwh / power;
      totalEstimatedSeconds = Math.round(totalHours * 3600);
      const hours = Math.floor(totalHours);
      const minutes = Math.round((totalHours - hours) * 60);
      document.getElementById('timeDisplay').textContent = `Tempo estimado: ${hours}h ${minutes}min`;
    } else {
      totalEstimatedSeconds = 0;
      document.getElementById('timeDisplay').textContent = `Tempo estimado: 0h 0min`;
    }

    const currentKm = Math.round((car.km100 * currentPct) / 100);
    const targetKm = Math.round((car.km100 * targetPct) / 100);

    document.getElementById('currentRangeDisplay').textContent = `Autonomia com carga atual: ${currentKm} km`;
    document.getElementById('targetRangeDisplay').textContent = `Autonomia com meta escolhida: ${targetKm} km`;

    // Atualiza a contagem se a simulação já estiver ativa
    if (isTimerActive) {
      updateActiveTimerState();
    }
  }

  function startChargingTimer() {
    if (totalEstimatedSeconds <= 0) {
      alert("Defina uma meta e selecione um carregador com potência válida para iniciar.");
      return;
    }

    if ("Notification" in window && Notification.permission !== "granted") {
      Notification.requestPermission();
    }

    hasAlertedPreFinish = false;
    isTimerActive = true;
    timerStartTime = Date.now();

    document.getElementById('timerPanel').style.display = 'block';
    document.getElementById('startChargeBtn').style.display = 'none';
    document.getElementById('cancelChargeBtn').style.display = 'block';

    updateActiveTimerState();

    if (timerInterval) clearInterval(timerInterval);

    timerInterval = setInterval(() => {
      updateActiveTimerState();
    }, 1000);
  }

  function updateActiveTimerState() {
    if (!isTimerActive) return;

    const elapsedSeconds = Math.floor((Date.now() - timerStartTime) / 1000);
    let remainingSeconds = totalEstimatedSeconds - elapsedSeconds;

    const alertMinutes = parseInt(document.getElementById('alertMinutes').value) || 10;
    const alertSecondsThreshold = alertMinutes * 60;

    // Rearma o alerta se a meta/potência foi aumentada e o tempo voltou a ser maior que a janela de alerta
    if (remainingSeconds > alertSecondsThreshold) {
      hasAlertedPreFinish = false;
      const minTextInitial = alertMinutes === 1 ? "1 min" : `${alertMinutes} min`;
      document.getElementById('timerStatusMsg').textContent = `⚡ Notificação programada para faltar ${minTextInitial}`;
      document.getElementById('timerStatusMsg').style.color = "var(--text-muted)";
    }

    if (remainingSeconds <= 0) {
      remainingSeconds = 0;
      updateTimerDisplay(0);
      clearInterval(timerInterval);
      triggerFinalAlert();
      return;
    }

    updateTimerDisplay(remainingSeconds);

    if (remainingSeconds <= alertSecondsThreshold && !hasAlertedPreFinish) {
      hasAlertedPreFinish = true;
      triggerPreFinishAlert(alertMinutes);
    }
  }

  function stopChargingTimer() {
    isTimerActive = false;
    if (timerInterval) clearInterval(timerInterval);
    document.getElementById('timerPanel').style.display = 'none';
    document.getElementById('startChargeBtn').style.display = 'block';
    document.getElementById('cancelChargeBtn').style.display = 'none';
  }

  function updateTimerDisplay(seconds) {
    const h = Math.floor(seconds / 3600);
    const m = Math.floor((seconds % 3600) / 60);
    const s = seconds % 60;

    const pad = num => String(num).padStart(2, '0');
    document.getElementById('countdownDisplay').textContent = `${pad(h)}:${pad(m)}:${pad(s)}`;
  }

  function triggerPreFinishAlert(minutes) {
    let alertMsg = "";
    if (minutes === 1) {
      alertMsg = "⚠️ ATENÇÃO: Falta 1 minuto para o fim da simulação!";
    } else {
      alertMsg = `⚠️ ATENÇÃO: Faltam ${minutes} minutos para o fim da simulação!`;
    }

    document.getElementById('timerStatusMsg').textContent = alertMsg;
    document.getElementById('timerStatusMsg').style.color = "#f59e0b";

    if ("vibrate" in navigator) {
      navigator.vibrate([500, 250, 500, 250, 500]);
    }

    playBeepSound();

    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("⚡ EletroCalc — Alerta de Carga", {
        body: alertMsg.replace("⚠️ ATENÇÃO: ", ""),
        icon: "logo.png"
      });
    }
  }

  function triggerFinalAlert() {
    isTimerActive = false;
    document.getElementById('countdownDisplay').textContent = "00:00:00";
    document.getElementById('timerStatusMsg').textContent = "Simulação de carregamento concluída!";
    document.getElementById('timerStatusMsg').style.color = "#10b981";

    if ("vibrate" in navigator) {
      navigator.vibrate([1000, 300, 1000, 300, 1000]);
    }

    playBeepSound();

    if ("Notification" in window && Notification.permission === "granted") {
      new Notification("⚡ EletroCalc", {
        body: "Simulação de carregamento concluída!",
        icon: "logo.png"
      });
    }
  }

  function playBeepSound() {
    try {
      const ctx = new (window.AudioContext || window.webkitAudioContext)();
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();

      osc.type = "sine";
      osc.frequency.setValueAtTime(880, ctx.currentTime);
      gain.gain.setValueAtTime(0.3, ctx.currentTime);

      osc.connect(gain);
      gain.connect(ctx.destination);

      osc.start();
      osc.stop(ctx.currentTime + 1.2);
    } catch(e) {
      console.log("Áudio aguardando interação do usuário.");
    }
  }

  function exportTXT() {
    const allCars = getAllCarsFlat();
    const selectedId = parseInt(document.getElementById('modelSelect').value);
    const car = allCars.find(c => c.id === selectedId) || allCars[0];
    
    const currentPct = parseFloat(document.getElementById('currentBattery').value);
    const targetPct = parseFloat(document.getElementById('targetBattery').value);
    const pricePerKwh = parseInputValue('pricePerKwh');
    const startFee = parseInputValue('startFee');
    const alertMin = parseInt(document.getElementById('alertMinutes').value) || 10;
    
    let powerSelectVal = document.getElementById('chargerPower').value;
    let powerStr = "";
    let powerNum = 0;

    if (powerSelectVal === 'custom') {
      powerNum = parseInputValue('manualChargerPower');
      powerStr = `${powerNum.toString().replace('.', ',')} kW (Manual)`;
    } else {
      powerNum = parseFloat(powerSelectVal) || 0;
      powerStr = `${powerNum.toString().replace('.', ',')} kW`;
    }

    const isShared = document.getElementById('sharedPower').checked;
    const sharedText = isShared ? "Sim" : "Não";

    if (isShared && powerNum > 0) {
      powerNum = powerNum / 2;
      powerStr += ` (Efetiva: ${powerNum.toFixed(1).replace('.', ',')} kW)`;
    }

    const diffPct = Math.max(0, targetPct - currentPct);
    const neededKwh = car.kwh * (diffPct / 100);
    const totalCost = (neededKwh * pricePerKwh) + startFee;

    let timeStr = "0h 0min";
    if (powerNum > 0 && diffPct > 0) {
      const totalHours = neededKwh / powerNum;
      const hours = Math.floor(totalHours);
      const minutes = Math.round((totalHours - hours) * 60);
      timeStr = `${hours}h ${minutes}min`;
    }

    const currentKm = Math.round((car.km100 * currentPct) / 100);
    const targetKm = Math.round((car.km100 * targetPct) / 100);
    const dataAtual = new Date().toLocaleDateString('pt-BR');
    const horaAtual = new Date().toLocaleTimeString('pt-BR', { hour: '2-digit', minute: '2-digit' });

    const txtContent = 
`==================================================
                 ⚡ ELETROCALC
    Relatório de Estimativa de Carregamento
==================================================
Data: ${dataAtual} às ${horaAtual}

--- DADOS DO VEÍCULO E PARÂMETROS ---
Marca / Modelo:           ${car.marcaGroup} ${car.modelo}
Capacidade da Bateria:    ${car.kwh} kWh
Carga Atual:              ${currentPct}%
Meta Desejada:            ${targetPct}%
Potência do Carregador:   ${powerStr}
Valor por kWh:            R$ ${pricePerKwh.toFixed(2).replace('.', ',')}
Taxa de Start / Início:   R$ ${startFee.toFixed(2).replace('.', ',')}
Alerta Programado:        Faltando ${alertMin} min
Potência Compartilhada:   ${sharedText}

--- RESUMO FINANCEIRO E TÉCNICO ---
VALOR TOTAL ESTIMADO:     R$ ${totalCost.toFixed(2).replace('.', ',')}
Energia Necessária:       ${neededKwh.toFixed(1)} kWh
Tempo Estimado de Carga:  ${timeStr}

--- ESTIMATIVA DE AUTONOMIA (INMETRO) ---
Autonomia Carga Atual:    ${currentKm} km
Autonomia Meta Escolhida: ${targetKm} km
Autonomia Total (100%):   ${car.km100} km
==================================================
EletroCalc — Calculadora de Carregamento Veicular
==================================================`;

    const blob = new Blob([txtContent], { type: 'text/plain;charset=utf-8' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = `EletroCalc_${car.marcaGroup}_${car.modelo}.txt`;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  window.onload = initApp;
</script>

      navigator.serviceWorker.register('./sw.js')
        .then(reg => console.log('Service Worker registrado:', reg))
        .catch(err => console.error('Erro no Service Worker:', err));
